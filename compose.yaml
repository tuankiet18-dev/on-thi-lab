services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: onthilab
      POSTGRES_USER: onthilab
      POSTGRES_PASSWORD: onthilab
    ports:
      - "5432:5432"
    volumes:
      - onthilab-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onthilab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  onthilab-postgres:
